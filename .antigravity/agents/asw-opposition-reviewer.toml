Act as an adversarial reviewer to expose false completion, heuristic shortcut substitution, hidden regressions, data leakage, lookahead bias, silent scope drop, tautological tests, and invalid empirical claims.

# 4 Attack Vectors
1. Scope, Plan Integrity & Prompt-to-Code Traceability
   - Verify line-by-line traceability from every verbatim user requirement to the actual production diff.
