<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Antigravity Swarm Coordinator — Test-Verified Token Efficiency Telemetry</title>
  <desc id="desc">Animated telemetry dashboard comparing Baseline agent token consumption against Antigravity Swarm Coordinator across RTK CLI pre-filtering (-87.8%), 200-Skill Catalog curation (-90.2%), Hook Channel Hygiene (-100% duplicate hook bloat), and TokenEconomizer + Laya System 1 loop guard (-39.61% post-warmup effective tokens, 0.0 optimizer overhead).</desc>

  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-alt: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --baseline: #f85149;
      --baseline-track: #3d1f24;
      --swarm: #2ea043;
      --swarm-bright: #3fb950;
      --accent: #58a6ff;
      --purple: #a371f7;
      --amber: #d29922;
      --badge-bg: rgba(46, 160, 67, 0.15);
      --badge-border: rgba(63, 185, 80, 0.4);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --panel: #ffffff;
        --panel-alt: #f0f3f6;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --baseline: #cf222e;
        --baseline-track: #ffebe9;
        --swarm: #1a7f37;
        --swarm-bright: #1a7f37;
        --accent: #0969da;
        --purple: #8250df;
        --amber: #9a6700;
        --badge-bg: #dafbe1;
        --badge-border: #4ac26b;
      }
    }

    .font-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    .bg-root { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .card { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .card-alt { fill: var(--panel-alt); stroke: var(--border); stroke-width: 1; }
    .txt-main { fill: var(--text); }
    .txt-muted { fill: var(--muted); }
    .txt-green { fill: var(--swarm-bright); }
    .txt-blue { fill: var(--accent); }
    .txt-purple { fill: var(--purple); }
    .txt-red { fill: var(--baseline); }
    .badge { fill: var(--badge-bg); stroke: var(--badge-border); stroke-width: 1; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .pulse {
      animation: pulseDot 2.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .bar-anim {
      animation: growBar 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-box: fill-box;
      transform-origin: left center;
    }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.18s; }
    .delay-3 { animation-delay: 0.28s; }
    .delay-4 { animation-delay: 0.38s; }
    .delay-5 { animation-delay: 0.48s; }
  </style>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="972" height="552" rx="14" class="bg-root" />

  <!-- Header Bar -->
  <text x="28" y="38" class="font-ui txt-main" font-size="18" font-weight="700">⚡ Antigravity Swarm Coordinator — Token Efficiency Telemetry</text>
  <text x="28" y="58" class="font-ui txt-muted" font-size="12">Multi-layer empirical savings verified by automated benchmark suite (rtk 0.48.0 + 200-Skill Catalog + TokenEconomizer + Laya System 1)</text>

  <!-- Live Status Pill -->
  <rect x="708" y="20" width="244" height="30" rx="15" class="badge" />
  <circle cx="726" cy="35" r="5" fill="#3fb950" class="pulse" />
  <text x="739" y="39" class="font-mono txt-green" font-size="11" font-weight="700">VERIFIED • 115/115 TESTS PASS</text>

  <!-- Top 4 KPI Cards -->
  <!-- KPI 1 -->
  <rect x="28" y="76" width="220" height="92" rx="10" class="card" />
  <text x="44" y="99" class="font-ui txt-muted" font-size="11" font-weight="600">CLI STDOUT PROXY (RTK 0.48)</text>
  <text x="44" y="134" class="font-mono txt-green" font-size="29" font-weight="800">-87.8%</text>
  <text x="44" y="154" class="font-mono txt-muted" font-size="11">107,704 ➔ 13,113 tok</text>

  <!-- KPI 2 -->
  <rect x="262" y="76" width="220" height="92" rx="10" class="card" />
