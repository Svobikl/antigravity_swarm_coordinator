  <text x="46" y="292" class="font-ui txt-main" font-size="12" font-weight="600">2. Startup Skill Metadata Index (2,040 raw vs. 200 curated)</text>
  <text x="578" y="292" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">-90.2% (0 truncated)</text>
  <rect x="46" y="299" width="420" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-2" />
  <rect x="46" y="310" width="41" height="8" rx="4" fill="#3fb950" class="bar-anim delay-2" />
  <text x="474" y="307" class="font-mono txt-muted" font-size="10">~92,000</text>
  <text x="95" y="318" class="font-mono txt-green" font-size="10" font-weight="700">~9,000</text>

  <!-- Row 3: Session 4 Promoted EnvFacts -->
  <text x="46" y="344" class="font-ui txt-main" font-size="12" font-weight="600">3. Promoted EnvFacts Micro-Skill (Session S4 • K=3 learned)</text>
  <text x="578" y="344" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">-75.04% (4 ➔ 1 req)</text>
  <rect x="46" y="351" width="420" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-3" />
  <rect x="46" y="362" width="105" height="8" rx="4" fill="#3fb950" class="bar-anim delay-3" />
  <text x="474" y="359" class="font-mono txt-muted" font-size="10">8,935 eff</text>
  <text x="159" y="370" class="font-mono txt-green" font-size="10" font-weight="700">2,230 eff</text>

  <!-- Row 4: Session 5 TurnGuard + Laya -->
  <text x="46" y="396" class="font-ui txt-main" font-size="12" font-weight="600">4. Edit-Churn Spiral Redirect (Session S5 • TurnGuard + Laya)</text>
