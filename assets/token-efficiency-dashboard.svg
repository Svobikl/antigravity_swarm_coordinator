  <rect x="610" y="184" width="342" height="318" rx="10" class="card" />
  <text x="628" y="211" class="font-ui txt-main" font-size="14" font-weight="700">A/B Benchmark Trajectory (S1–S6)</text>
  <text x="628" y="228" class="font-ui txt-muted" font-size="11">Cache-weighted effective_tokens (Gemini 4 Carbon)</text>

  <!-- Chart Grid -->
  <line x1="636" y1="252" x2="932" y2="252" stroke="#30363d" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="636" y1="312" x2="932" y2="312" stroke="#30363d" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="636" y1="372" x2="932" y2="372" stroke="#30363d" stroke-dasharray="3,3" stroke-width="1" />
