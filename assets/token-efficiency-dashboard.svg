  <text x="578" y="448" text-anchor="end" class="font-mono txt-blue" font-size="11" font-weight="700">-35.82% (-139,625 raw)</text>
  <rect x="46" y="455" width="420" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-5" />
  <rect x="46" y="466" width="270" height="8" rx="4" fill="#58a6ff" class="bar-anim delay-5" />
  <text x="474" y="463" class="font-mono txt-muted" font-size="10">389,800</text>
  <text x="324" y="474" class="font-mono txt-blue" font-size="10" font-weight="700">250,175</text>

