  <!-- KPI 4 -->
  <rect x="730" y="76" width="222" height="92" rx="10" class="card" />
  <text x="746" y="99" class="font-ui txt-muted" font-size="11" font-weight="600">OPTIMIZER API OVERHEAD</text>
  <text x="746" y="134" class="font-mono txt-green" font-size="29" font-weight="800">0.0 tok</text>
  <text x="746" y="154" class="font-mono txt-muted" font-size="11">Local Laya Judge (&lt;5 ms CPU)</text>

