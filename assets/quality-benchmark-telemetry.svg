<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="title desc">
  <title id="title">SWE-MiniBench-5 — Stock Orchestrator Carbon (Baseline) vs Antigravity Swarm Coordinator V4.1</title>
  <desc id="desc">Quality and multi-tier token telemetry comparing Stock Orchestrator Carbon (Baseline) (2/5 Pass@1, 46/50 holdout, 2,175,657 effective tokens) against Antigravity Swarm Coordinator V4.1 (3/5 Pass@1, 47/50 holdout, 2,001,899 effective tokens).</desc>

  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-alt: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --baseline: #f85149;
      --swarm: #2ea043;
      --swarm-bright: #3fb950;
      --accent: #58a6ff;
      --purple: #a371f7;
      --badge-bg: rgba(46, 160, 67, 0.15);
      --badge-border: rgba(63, 185, 80, 0.4);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --panel: #ffffff;
        --panel-alt: #f0f3f6;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --baseline: #cf222e;
        --swarm: #1a7f37;
        --swarm-bright: #1a7f37;
        --accent: #0969da;
        --purple: #8250df;
        --badge-bg: #dafbe1;
        --badge-border: #4ac26b;
      }
    }
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .bg-root { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .card { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .card-alt { fill: var(--panel-alt); stroke: var(--border); stroke-width: 1; }
    .txt-main { fill: var(--text); }
    .txt-muted { fill: var(--muted); }
    .txt-green { fill: var(--swarm-bright); }
    .txt-blue { fill: var(--accent); }
    .txt-purple { fill: var(--purple); }
    .txt-red { fill: var(--baseline); }
    .badge { fill: var(--badge-bg); stroke: var(--badge-border); stroke-width: 1; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .pulse { animation: pulseDot 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bar-anim { animation: growBar 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards; transform-box: fill-box; transform-origin: left center; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }
    .delay-5 { animation-delay: 0.40s; }
  </style>

  <rect x="4" y="4" width="972" height="552" rx="14" class="bg-root" />

  <text x="28" y="36" class="font-ui txt-main" font-size="17" font-weight="700">SWE-MiniBench-5 — Quality &amp; Token Telemetry</text>
  <text x="28" y="56" class="font-ui txt-muted" font-size="11">Stock Orchestrator Carbon (Baseline) vs. Antigravity Swarm Coordinator V4.1 (5 tasks • 50 holdout assertions)</text>

  <rect x="704" y="20" width="248" height="28" rx="14" class="badge" />
  <circle cx="722" cy="34" r="5" fill="#3fb950" class="pulse" />
  <text x="735" y="38" class="font-mono txt-green" font-size="11" font-weight="700">0 LEAKAGE • PASS@1 3/5</text>

  <rect x="28" y="74" width="220" height="92" rx="10" class="card" />
  <text x="44" y="96" class="font-ui txt-muted" font-size="11" font-weight="600">PASS@1 SOLVED TASKS</text>
  <text x="44" y="131" class="font-mono txt-green" font-size="27" font-weight="800">2/5 ➔ 3/5</text>
  <text x="44" y="152" class="font-mono txt-muted" font-size="11">Strict 10/10 holdout + public</text>

  <rect x="262" y="74" width="220" height="92" rx="10" class="card" />
  <text x="278" y="96" class="font-ui txt-muted" font-size="11" font-weight="600">HOLDOUT ASSERTIONS</text>
  <text x="278" y="131" class="font-mono txt-blue" font-size="27" font-weight="800">46/50 ➔ 47/50</text>
  <text x="278" y="152" class="font-mono txt-muted" font-size="11">Delta: +1 assertions</text>

  <rect x="496" y="74" width="220" height="92" rx="10" class="card" />
  <text x="512" y="96" class="font-ui txt-muted" font-size="11" font-weight="600">EFFECTIVE TOKENS (4-TIER)</text>
  <text x="512" y="131" class="font-mono txt-purple" font-size="27" font-weight="800">-8.0%</text>
  <text x="512" y="152" class="font-mono txt-muted" font-size="11">2,175,657 ➔ 2,001,899 eff</text>

  <rect x="730" y="74" width="222" height="92" rx="10" class="card" />
  <text x="746" y="96" class="font-ui txt-muted" font-size="11" font-weight="600">RAW TRANSCRIPT TOKENS</text>
  <text x="746" y="131" class="font-mono txt-green" font-size="27" font-weight="800">+34.6%</text>
  <text x="746" y="152" class="font-mono txt-muted" font-size="11">3,871,113 ➔ 5,209,177 raw</text>

  <rect x="28" y="182" width="568" height="320" rx="10" class="card" />
  <text x="46" y="209" class="font-ui txt-main" font-size="13" font-weight="700">Per-Task Holdout Scoreboard (T1..T5)</text>
  <circle cx="426" cy="204" r="5" fill="#f85149" />
  <text x="436" y="208" class="font-ui txt-muted" font-size="11">Baseline</text>
  <circle cx="496" cy="204" r="5" fill="#3fb950" />
  <text x="506" y="208" class="font-ui txt-muted" font-size="11">Swarm V4.1</text>

  <text x="46" y="240" class="font-ui txt-main" font-size="12" font-weight="600">T1 — Order Gateway &amp; Ledger</text>
  <text x="578" y="240" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">8/10 ➔ 8/10</text>
  <rect x="46" y="247" width="272" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-1" />
  <rect x="46" y="258" width="272" height="8" rx="4" fill="#3fb950" class="bar-anim delay-1" />
  <text x="326" y="255" class="font-mono txt-muted" font-size="10">497,081 eff</text>
  <text x="326" y="266" class="font-mono txt-green" font-size="10" font-weight="700">376,924 eff</text>
  <text x="46" y="292" class="font-ui txt-main" font-size="12" font-weight="600">T2 — Multi-Layer Config DAG</text>
  <text x="578" y="292" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">9/10 ➔ 10/10</text>
  <rect x="46" y="299" width="306" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-2" />
  <rect x="46" y="310" width="340" height="8" rx="4" fill="#3fb950" class="bar-anim delay-2" />
  <text x="360" y="307" class="font-mono txt-muted" font-size="10">495,590 eff</text>
  <text x="394" y="318" class="font-mono txt-green" font-size="10" font-weight="700">491,726 eff</text>
  <text x="46" y="344" class="font-ui txt-main" font-size="12" font-weight="600">T3 — Walk-Forward Quant Backtest</text>
  <text x="578" y="344" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">10/10 ➔ 10/10</text>
  <rect x="46" y="351" width="340" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-3" />
  <rect x="46" y="362" width="340" height="8" rx="4" fill="#3fb950" class="bar-anim delay-3" />
  <text x="394" y="359" class="font-mono txt-muted" font-size="10">378,814 eff</text>
  <text x="394" y="370" class="font-mono txt-green" font-size="10" font-weight="700">369,897 eff</text>
  <text x="46" y="396" class="font-ui txt-main" font-size="12" font-weight="600">T4 — 2-Level Token Rate Limiter</text>
  <text x="578" y="396" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">9/10 ➔ 9/10</text>
  <rect x="46" y="403" width="306" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-4" />
  <rect x="46" y="414" width="306" height="8" rx="4" fill="#3fb950" class="bar-anim delay-4" />
  <text x="360" y="411" class="font-mono txt-muted" font-size="10">366,452 eff</text>
  <text x="360" y="422" class="font-mono txt-green" font-size="10" font-weight="700">414,465 eff</text>
  <text x="46" y="448" class="font-ui txt-main" font-size="12" font-weight="600">T5 — Outbox Dispatcher &amp; Replay</text>
  <text x="578" y="448" text-anchor="end" class="font-mono txt-green" font-size="11" font-weight="700">10/10 ➔ 10/10</text>
  <rect x="46" y="455" width="340" height="8" rx="4" fill="#f85149" opacity="0.82" class="bar-anim delay-5" />
  <rect x="46" y="466" width="340" height="8" rx="4" fill="#3fb950" class="bar-anim delay-5" />
  <text x="394" y="463" class="font-mono txt-muted" font-size="10">437,721 eff</text>
  <text x="394" y="474" class="font-mono txt-green" font-size="10" font-weight="700">348,886 eff</text>

  <rect x="610" y="182" width="342" height="320" rx="10" class="card" />
  <text x="628" y="209" class="font-ui txt-main" font-size="13" font-weight="700">Swarm Multi-Tier Token Split</text>
  <text x="628" y="226" class="font-ui txt-muted" font-size="11">MODEL_WEIGHTS across Carbon / Argon / Hydrogen / Opus 5.5</text>

  <text x="628" y="266" class="font-ui txt-main" font-size="11" font-weight="600">Carbon (Plan)</text>
  <text x="934" y="266" text-anchor="end" class="font-mono txt-muted" font-size="10">482,421 eff (24.1%)</text>
  <rect x="628" y="273" width="306" height="9" rx="4" class="card-alt" />
  <rect x="628" y="273" width="99" height="9" rx="4" fill="#f85149" class="bar-anim delay-1" />
  <text x="628" y="295" class="font-mono txt-muted" font-size="9">raw: 938,994 tok</text>
  <text x="628" y="312" class="font-ui txt-main" font-size="11" font-weight="600">Argon (Review)</text>
  <text x="934" y="312" text-anchor="end" class="font-mono txt-muted" font-size="10">542,641 eff (27.1%)</text>
  <rect x="628" y="319" width="306" height="9" rx="4" class="card-alt" />
  <rect x="628" y="319" width="111" height="9" rx="4" fill="#a371f7" class="bar-anim delay-2" />
  <text x="628" y="341" class="font-mono txt-muted" font-size="9">raw: 1,252,126 tok</text>
  <text x="628" y="358" class="font-ui txt-main" font-size="11" font-weight="600">Hydrogen (Impl)</text>
  <text x="934" y="358" text-anchor="end" class="font-mono txt-muted" font-size="10">976,836 eff (48.8%)</text>
  <rect x="628" y="365" width="306" height="9" rx="4" class="card-alt" />
  <rect x="628" y="365" width="200" height="9" rx="4" fill="#3fb950" class="bar-anim delay-3" />
  <text x="628" y="387" class="font-mono txt-muted" font-size="9">raw: 3,018,057 tok</text>
  <text x="628" y="404" class="font-ui txt-main" font-size="11" font-weight="600">Opus 5.5 (Opp)</text>
  <text x="934" y="404" text-anchor="end" class="font-mono txt-muted" font-size="10">0 eff (0.0%)</text>
  <rect x="628" y="411" width="306" height="9" rx="4" class="card-alt" />
  <rect x="628" y="411" width="4" height="9" rx="4" fill="#58a6ff" class="bar-anim delay-4" />
  <text x="628" y="433" class="font-mono txt-muted" font-size="9">raw: 0 tok</text>

  <rect x="628" y="454" width="306" height="34" rx="6" class="card-alt" />
  <text x="638" y="475" class="font-mono txt-muted" font-size="10">Baseline Carbon: 2,175,657 eff (3,871,113 raw)</text>

  <rect x="28" y="514" width="924" height="30" rx="7" class="card-alt" />
  <text x="42" y="533" class="font-mono txt-muted" font-size="11">Verify oracle: python .antigravity/scripts/quality_benchmark.py --verify-oracle --json</text>
</svg>
